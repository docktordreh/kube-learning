id: architecture-004
title: Install a CRD and create a custom resource
domain: architecture
objectives: [architecture/crds-operators, architecture/extension-interfaces]
difficulty: 1
estimated_minutes: 5
backends: [kind, kubeadm]
namespaces: ["{{ns}}"]
owned: ["customresourcedefinition/backuppolicies.ops.cka.example"]
params:
  ns: {choices: [databases, stateful, data-platform]}
  schedule: {choices: ["0 2 * * *", "30 1 * * *", "15 3 * * *"]}
  days: {choices: ["7", "14", "30"]}

setup:
  - script: |
      set -eu
      cat > "$CKA_WORKDIR/backuppolicy-crd.yaml" <<'EOF'
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: backuppolicies.ops.cka.example
      spec:
        group: ops.cka.example
        scope: Namespaced
        names:
          plural: backuppolicies
          singular: backuppolicy
          kind: BackupPolicy
          shortNames: [bp]
        versions:
          - name: v1
            served: true
            storage: true
            additionalPrinterColumns:
              - {name: Schedule, type: string, jsonPath: .spec.schedule}
              - {name: Retention, type: integer, jsonPath: .spec.retentionDays}
            schema:
              openAPIV3Schema:
                type: object
                properties:
                  spec:
                    type: object
                    required: [schedule, retentionDays]
                    properties:
                      schedule: {type: string}
                      retentionDays: {type: integer, minimum: 1, maximum: 365}
                      target: {type: string}
      EOF

checks:
  - id: crd-established
    description: "CRD backuppolicies.ops.cka.example is Established"
    type: jsonpath
    resource: crd/backuppolicies.ops.cka.example
    jsonpath: "{.status.conditions[?(@.type=='Established')].status}"
    value: "True"
    timeout: 20
  - id: cr-spec
    description: "BackupPolicy nightly in {{ns}} has the requested spec"
    type: jsonpath
    resource: backuppolicies.ops.cka.example/nightly
    namespace: "{{ns}}"
    jsonpath: "{.spec.schedule}|{.spec.retentionDays}|{.spec.target}"
    value: "{{schedule}}|{{days}}|postgres-main"
  - id: crd-unchanged
    role: guard
    description: "The CRD was installed as provided (shortName bp, namespaced)"
    type: script
    script: |
      out=$(kubectl get crd backuppolicies.ops.cka.example -o jsonpath='{.spec.scope} {.spec.names.shortNames[*]}' 2>/dev/null) || exit 0
      echo "$out"; [ "$out" = "Namespaced bp" ]

hints:
  - "The CRD manifest is ready in {{workdir}}; installing a CRD is a plain `kubectl apply -f`."
  - "After installation, `kubectl explain backuppolicy.spec` and `kubectl api-resources | grep cka` tell you the kind, group and fields."
  - "Write a manifest with `apiVersion: ops.cka.example/v1`, `kind: BackupPolicy`, `metadata.name: nightly` and the three spec fields. retentionDays is an integer, so do not quote it."

competencies:
  - Installing CustomResourceDefinitions
  - Discovering custom APIs with api-resources and explain
  - Creating custom resources validated by an OpenAPI schema

docs:
  - https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/
  - https://kubernetes.io/docs/concepts/extend-kubernetes/operator/
