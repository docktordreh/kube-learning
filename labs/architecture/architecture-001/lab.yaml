id: architecture-001
title: Least-privilege ServiceAccount for a deploy pipeline
domain: architecture
objectives: [architecture/rbac]
difficulty: 2
estimated_minutes: 7
backends: [kind, kubeadm]
namespaces: ["{{ns}}"]
params:
  ns: {choices: [ci-apps, delivery, pipelines]}
  sa: {choices: [deployer, release-bot, cd-agent]}

setup: []

checks:
  - id: sa-exists
    description: "ServiceAccount {{sa}} exists in {{ns}}"
    type: exists
    resource: "serviceaccount/{{sa}}"
    namespace: "{{ns}}"
  - id: manage-deployments
    description: "{{sa}} can create Deployments in {{ns}}"
    type: can_i
    user: "system:serviceaccount:{{ns}}:{{sa}}"
    verb: create
    api_group: apps
    resource: deployments
    namespace: "{{ns}}"
  - id: delete-deployments
    description: "{{sa}} can delete Deployments in {{ns}}"
    type: can_i
    user: "system:serviceaccount:{{ns}}:{{sa}}"
    verb: delete
    api_group: apps
    resource: deployments
    namespace: "{{ns}}"
  - id: patch-deployments
    description: "{{sa}} can patch Deployments in {{ns}}"
    type: can_i
    user: "system:serviceaccount:{{ns}}:{{sa}}"
    verb: patch
    api_group: apps
    resource: deployments
    namespace: "{{ns}}"
  - id: list-pods
    description: "{{sa}} can list Pods in {{ns}}"
    type: can_i
    user: "system:serviceaccount:{{ns}}:{{sa}}"
    verb: list
    resource: pods
    namespace: "{{ns}}"
  - id: read-logs
    description: "{{sa}} can read Pod logs in {{ns}}"
    type: can_i
    user: "system:serviceaccount:{{ns}}:{{sa}}"
    verb: get
    resource: pods
    subresource: log
    namespace: "{{ns}}"
  - id: no-secrets
    role: guard
    description: "{{sa}} cannot read Secrets in {{ns}}"
    type: can_i
    user: "system:serviceaccount:{{ns}}:{{sa}}"
    verb: get
    resource: secrets
    namespace: "{{ns}}"
    allowed: false
  - id: no-pod-delete
    role: guard
    description: "{{sa}} cannot delete Pods in {{ns}}"
    type: can_i
    user: "system:serviceaccount:{{ns}}:{{sa}}"
    verb: delete
    resource: pods
    namespace: "{{ns}}"
    allowed: false
  - id: no-other-namespace
    role: guard
    description: "{{sa}} cannot create Deployments in namespace default"
    type: can_i
    user: "system:serviceaccount:{{ns}}:{{sa}}"
    verb: create
    api_group: apps
    resource: deployments
    namespace: default
    allowed: false
  - id: no-nodes
    role: guard
    description: "{{sa}} cannot list Nodes"
    type: can_i
    user: "system:serviceaccount:{{ns}}:{{sa}}"
    verb: list
    resource: nodes
    allowed: false

hints:
  - "You need three objects: a ServiceAccount, something that lists permissions, and something that grants them to the ServiceAccount."
  - "`kubectl create role --help` and `kubectl create rolebinding --help`. Deployments live in the `apps` API group; Pod logs are the `pods/log` subresource."
  - "A Role + RoleBinding is namespace-scoped, which is exactly what you want. Verify with `kubectl auth can-i create deployments -n {{ns}} --as=system:serviceaccount:{{ns}}:{{sa}}`."

competencies:
  - Creating ServiceAccounts, Roles and RoleBindings imperatively
  - Least-privilege RBAC with API groups and subresources
  - Verifying permissions with kubectl auth can-i --as

docs:
  - https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_auth/kubectl_auth_can-i/
  - https://kubernetes.io/docs/concepts/security/service-accounts/
