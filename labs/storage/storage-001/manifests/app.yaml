apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{app}}-data
  namespace: {{ns}}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{wrong_class}}
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{app}}
  template:
    metadata:
      labels:
        app: {{app}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: db
          image: docker.io/library/busybox:1.37
          command: ["sh", "-c", "date >> /var/lib/data/started && exec sleep infinity"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{app}}-data
