apiVersion: v1
kind: Pod
metadata:
  name: {{app}}
  namespace: {{ns}}
  labels:
    app: {{app}}
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: {{app}}
      image: docker.io/library/busybox:1.37
      command: ["sh", "-c", "date >> /data/boot.log && exec sleep infinity"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: {{app}}-claim
