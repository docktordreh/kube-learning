id: networking-003
title: Expose a Deployment on a fixed NodePort
objectives: [cka/networking/services, ckad/networking/services]
difficulty: 1
estimated_minutes: 4
backends: [kind, kubeadm]
namespaces: ["{{ns}}"]
params:
  ns: {choices: [edge, public, partner]}
  app: {choices: [docs, status, assets]}
  nodeport: {choices: ["30080", "30180", "31080"]}

setup:
  - apply: manifests/app.yaml
  - wait: {type: deployment_ready, namespace: "{{ns}}", name: "{{app}}"}
  - wait: {type: pods_ready, namespace: "{{ns}}", selector: "role=client"}
  - capture: node_ip
    resource: "node/{{node.worker2}}"
    jsonpath: '{.status.addresses[?(@.type=="InternalIP")].address}'

checks:
  - id: type
    description: "Service {{app}}-np is of type NodePort"
    type: jsonpath
    resource: "service/{{app}}-np"
    namespace: "{{ns}}"
    jsonpath: "{.spec.type}"
    value: NodePort
  - id: nodeport
    description: "Service port 80 is exposed on nodePort {{nodeport}}"
    type: jsonpath
    resource: "service/{{app}}-np"
    namespace: "{{ns}}"
    jsonpath: "{.spec.ports[?(@.port==80)].nodePort}"
    value: "{{nodeport}}"
  - id: endpoints
    description: "Service {{app}}-np selects both {{app}} Pods"
    type: service_endpoints
    namespace: "{{ns}}"
    service: "{{app}}-np"
    min_ready: 2
    timeout: 15
  - id: reachable
    description: "http://<node IP>:{{nodeport}} serves the app"
    type: exec
    namespace: "{{ns}}"
    pod: client
    command: [wget, -qO-, -T, "3", "http://{{captured.node_ip}}:{{nodeport}}"]
    output_matches: "Welcome to nginx"
    timeout: 15

hints:
  - "`kubectl expose` creates a Service from an existing Deployment's selector."
  - "`kubectl expose deployment {{app}} --help`: look at `--type`, `--port`, `--target-port` and `--name`. The node port itself cannot be set by a flag."
  - "Generate YAML with `--dry-run=client -o yaml`, add `nodePort: {{nodeport}}` under the port, and apply it (or `kubectl edit` / `kubectl patch` the created Service)."

competencies:
  - Service types and the ClusterIP/NodePort relationship
  - kubectl expose and dry-run YAML generation
  - Reaching a NodePort on a node's InternalIP

docs:
  - https://kubernetes.io/docs/concepts/services-networking/service/#type-nodeport
  - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_expose/
