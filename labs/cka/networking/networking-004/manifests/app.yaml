apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ns}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: httpd
          image: docker.io/library/busybox:1.37
          # Answers every known path with its own name, so routing is visible.
          command:
            - sh
            - -c
            - mkdir -p /www && for f in index.html api; do echo "served by api" > /www/$f; done && exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ns}}
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v1
  namespace: {{ns}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-v1
  template:
    metadata:
      labels:
        app: web-v1
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: httpd
          image: docker.io/library/busybox:1.37
          # Answers every known path with its own name, so routing is visible.
          command:
            - sh
            - -c
            - mkdir -p /www && for f in index.html api; do echo "served by web-v1" > /www/$f; done && exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web-v1
  namespace: {{ns}}
spec:
  selector:
    app: web-v1
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v2
  namespace: {{ns}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-v2
  template:
    metadata:
      labels:
        app: web-v2
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: httpd
          image: docker.io/library/busybox:1.37
          # Answers every known path with its own name, so routing is visible.
          command:
            - sh
            - -c
            - mkdir -p /www && for f in index.html api; do echo "served by web-v2" > /www/$f; done && exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web-v2
  namespace: {{ns}}
spec:
  selector:
    app: web-v2
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ingress}}
  namespace: {{ns}}
spec:
  ingressClassName: traefik
  rules:
    - host: {{host}}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-v1
                port:
                  number: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: {{ns}}
  labels:
    role: client
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: client
      image: docker.io/library/busybox:1.37
      command: ["sleep", "infinity"]
