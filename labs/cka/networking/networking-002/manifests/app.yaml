apiVersion: v1
kind: ConfigMap
metadata:
  name: api-nginx
  namespace: {{ns}}
data:
  default.conf: |
    server { listen {{port}}; location / { root /usr/share/nginx/html; } }
    server { listen 8443; location / { return 200 "admin\n"; } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ns}}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.31-alpine
          ports:
            - name: http
              containerPort: {{port}}
            - name: admin
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: api-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ns}}
spec:
  selector:
    app: api
  ports:
    - name: http
      port: {{port}}
      targetPort: http
    - name: admin
      port: 8443
      targetPort: admin
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ns}}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: {{ns}}
  labels:
    role: frontend
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: client
      image: docker.io/library/busybox:1.37
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: batch
  namespace: {{ns}}
  labels:
    role: batch
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: client
      image: docker.io/library/busybox:1.37
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: {{ns}}-ops
  labels:
    role: frontend
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: client
      image: docker.io/library/busybox:1.37
      command: ["sleep", "infinity"]
