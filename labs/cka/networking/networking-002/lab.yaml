id: networking-002
title: Open exactly one path through a default-deny NetworkPolicy
objectives: [cka/networking/network-policies, cka/networking/pod-connectivity, ckad/networking/network-policies, cks/cluster-setup/network-policies]
difficulty: 3
estimated_minutes: 10
backends: [kind, kubeadm]
namespaces: ["{{ns}}", "{{ns}}-ops"]
params:
  ns: {choices: [banking, claims, ledger]}
  port: {choices: ["8080", "9090"]}

setup:
  - apply: manifests/app.yaml
  - wait: {type: deployment_ready, namespace: "{{ns}}", name: api}
  - wait: {type: pods_ready, namespace: "{{ns}}", selector: "role in (frontend,batch)", min_ready: 2}
  - wait: {type: pods_ready, namespace: "{{ns}}-ops", selector: "role=frontend"}

checks:
  - id: frontend-allowed
    description: "frontend → api:{{port}} works"
    type: exec
    namespace: "{{ns}}"
    pod: frontend
    command: [wget, -qO-, -T, "3", "http://api.{{ns}}.svc.cluster.local:{{port}}"]
    output_matches: "Welcome to nginx"
    timeout: 20
  - id: batch-denied
    role: guard
    description: "batch Pod in {{ns}} still cannot reach api"
    type: exec
    namespace: "{{ns}}"
    pod: batch
    command: [wget, -qO-, -T, "3", "http://api.{{ns}}.svc.cluster.local:{{port}}"]
    expect: failure
  - id: other-namespace-denied
    role: guard
    description: "role=frontend Pod in {{ns}}-ops still cannot reach api"
    type: exec
    namespace: "{{ns}}-ops"
    pod: frontend
    command: [wget, -qO-, -T, "3", "http://api.{{ns}}.svc.cluster.local:{{port}}"]
    expect: failure
  - id: admin-port-denied
    role: guard
    description: "frontend still cannot reach the api's admin port 8443"
    type: exec
    namespace: "{{ns}}"
    pod: frontend
    command: [wget, -qO-, -T, "3", "http://api.{{ns}}.svc.cluster.local:8443"]
    expect: failure
  - id: default-deny-kept
    role: guard
    description: "NetworkPolicy default-deny-ingress still exists"
    type: exists
    resource: networkpolicy/default-deny-ingress
    namespace: "{{ns}}"

hints:
  - "List the policies in {{ns}} and read what they select: `kubectl -n {{ns}} get networkpolicy -o yaml`. Also note the labels of the Pods: `kubectl -n {{ns}} get pods --show-labels`."
  - "Policies are additive allow-lists. Keep the default deny and add a second policy whose podSelector matches the api Pods."
  - "Inside `from:`, a `podSelector` *without* a `namespaceSelector` only matches Pods in the policy's own namespace. Restrict `ports:` to TCP {{port}}. The api container listens on {{port}} (app) and 8443 (admin)."

competencies:
  - Writing ingress NetworkPolicies with pod selectors and ports
  - Understanding policy additivity and namespace scoping of selectors
  - Testing allowed and denied paths from inside the cluster

docs:
  - https://kubernetes.io/docs/concepts/services-networking/network-policies/
  - https://kubernetes.io/docs/tasks/administer-cluster/declare-network-policy/
