apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
  labels:
    app.kubernetes.io/name: {{app}}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{app}}
      tier: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{app}}
        tier: backend
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.31-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  selector:
    app.kubernetes.io/name: {{app}}
    tier: {{wrong_tier}}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: {{ns}}
  labels:
    role: client
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: client
      image: docker.io/library/busybox:1.37
      command: ["sleep", "infinity"]
