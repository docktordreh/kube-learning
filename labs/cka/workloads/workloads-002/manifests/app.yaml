apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
  annotations:
    kubernetes.io/change-cause: initial release
spec:
  replicas: 4
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: {{app}}
  template:
    metadata:
      labels:
        app: {{app}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.30-alpine
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
