id: storage-002
title: Pre-provisioned PersistentVolume for a legacy app
objectives: [cka/storage/pv-pvc, cka/storage/volumes, ckad/design-build/volumes]
difficulty: 2
estimated_minutes: 8
backends: [kind, kubeadm]
namespaces: ["{{ns}}"]
owned: ["persistentvolume/{{pv}}"]
params:
  ns: {choices: [legacy, archive, mainframe]}
  app: {choices: [ledger, vault, records]}
  pv: {choices: [legacy-pv-01, archive-pv-7, records-pv-a]}
  size: {choices: [256Mi, 512Mi]}

setup:
  - apply: manifests/app.yaml
  - wait:
      type: jsonpath
      resource: "pod/{{app}}"
      namespace: "{{ns}}"
      jsonpath: "{.status.phase}"
      value: Pending
    timeout: 30

checks:
  - id: pv-spec
    description: "PV {{pv}}: {{size}}, ReadWriteOnce, class manual, Retain"
    type: jsonpath
    resource: "pv/{{pv}}"
    jsonpath: "{.spec.capacity.storage} {.spec.accessModes[*]} {.spec.storageClassName} {.spec.persistentVolumeReclaimPolicy}"
    value: "{{size}} ReadWriteOnce manual Retain"
  - id: pv-path
    description: "PV {{pv}} is a hostPath volume at /srv/{{pv}}"
    type: jsonpath
    resource: "pv/{{pv}}"
    jsonpath: "{.spec.hostPath.path}"
    value: "/srv/{{pv}}"
  - id: pvc-bound
    description: "PVC {{app}}-claim is Bound to {{pv}}"
    type: jsonpath
    resource: "pvc/{{app}}-claim"
    namespace: "{{ns}}"
    jsonpath: "{.status.phase} {.spec.volumeName}"
    value: "Bound {{pv}}"
    timeout: 30
  - id: pod-ready
    description: "Pod {{app}} is Ready"
    type: pods_ready
    namespace: "{{ns}}"
    selector: "app={{app}}"
    timeout: 60

hints:
  - "Why is the Pod Pending? `kubectl -n {{ns}} describe pod {{app}}` names the missing claim."
  - "Write the PV (cluster-scoped) and the PVC (namespaced) yourself; the docs page 'Configure a Pod to Use a PersistentVolume for Storage' has both. Both need `storageClassName: manual`."
  - "A PVC binds to a PV when class, access mode and capacity are compatible. To force *this* PV, set `volumeName: {{pv}}` in the PVC. Without a class, the default StorageClass would be filled in and a new volume provisioned dynamically."

competencies:
  - Writing PersistentVolumes and PersistentVolumeClaims
  - Static binding rules (class, access mode, capacity, volumeName)
  - Reclaim policies

docs:
  - https://kubernetes.io/docs/tasks/configure-pod-container/configure-persistent-volume-storage/
  - https://kubernetes.io/docs/concepts/storage/persistent-volumes/#binding
  - https://kubernetes.io/docs/concepts/storage/persistent-volumes/#reclaim-policy
