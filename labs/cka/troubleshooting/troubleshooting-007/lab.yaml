id: troubleshooting-007
title: Worker node NotReady
objectives: [cka/troubleshooting/nodes, cka/troubleshooting/components]
difficulty: 3
estimated_minutes: 10
backends: [kind, kubeadm]
isolation: cluster
params:
  bad_ca: {choices: [/etc/kubernetes/pki/ca-bundle.crt, /etc/kubernetes/ssl/ca.crt, /etc/pki/kubernetes/ca.crt]}

setup:
  - node: "{{node.worker2}}"
    run: |
      set -eu
      mkdir -p /var/lib/cka-labs/troubleshooting-007
      [ -f /var/lib/cka-labs/troubleshooting-007/config.yaml ] || cp -a /var/lib/kubelet/config.yaml /var/lib/cka-labs/troubleshooting-007/config.yaml
      sed -i 's#^\(\s*clientCAFile:\).*#\1 {{bad_ca}}#' /var/lib/kubelet/config.yaml
      systemctl restart kubelet
  - wait: {type: node_ready, node: "{{node.worker2}}", ready: false}
    timeout: 180

cleanup:
  - node: "{{node.worker2}}"
    run: |
      set -eu
      backup=/var/lib/cka-labs/troubleshooting-007/config.yaml
      if [ -f "$backup" ]; then cp -a "$backup" /var/lib/kubelet/config.yaml && rm -f "$backup"; fi
      systemctl restart kubelet
  - wait: {type: node_ready, node: "{{node.worker2}}"}
    timeout: 180

checks:
  - id: node-ready
    description: "{{node.worker2}} is Ready"
    type: node_ready
    node: "{{node.worker2}}"
    timeout: 90
  - id: kubelet-active
    description: "kubelet service is active on {{node.worker2}}"
    type: node_exec
    node: "{{node.worker2}}"
    run: "systemctl is-active kubelet"
    output_matches: "^active"
    timeout: 30
  - id: kubelet-stable
    description: "kubelet has been running for at least 15 seconds (not crash-looping)"
    type: node_exec
    node: "{{node.worker2}}"
    run: |
      since=$(systemctl show kubelet -p ActiveEnterTimestampMonotonic --value)
      now=$(awk '{print int($1 * 1000000)}' /proc/uptime)
      [ "$since" -gt 0 ] && [ $(( (now - since) / 1000000 )) -ge 15 ]
    timeout: 45
  - id: other-nodes
    role: guard
    description: "{{node.worker1}} is still Ready"
    type: node_ready
    node: "{{node.worker1}}"

hints:
  - "`kubectl get nodes` and `kubectl describe node {{node.worker2}}`: what do the conditions say about the kubelet? Then log on to the node: `cka ssh {{node.worker2}}`."
  - "On the node: `systemctl status kubelet` and `journalctl -u kubelet --no-pager | tail -n 30`. The last error before each restart tells you what is missing."
  - "The kubelet's configuration is `/var/lib/kubelet/config.yaml` (see `systemctl cat kubelet`). Point the failing setting to the file that actually exists (`ls /etc/kubernetes/pki/`), then `systemctl restart kubelet`."

competencies:
  - Node conditions and the NodeReady lifecycle
  - Inspecting systemd units and journald logs for the kubelet
  - kubelet configuration file and flags (kubeadm layout)

docs:
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/
  - https://kubernetes.io/docs/reference/config-api/kubelet-config.v1beta1/
  - https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/kubelet-integration/
