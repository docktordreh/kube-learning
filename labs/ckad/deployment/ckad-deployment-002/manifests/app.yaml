apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
  labels:
    app: {{app}}
    track: stable
spec:
  replicas: 5
  selector:
    matchLabels:
      app: {{app}}
      track: stable
  template:
    metadata:
      labels:
        app: {{app}}
        track: stable
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.30-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  selector:
    app: {{app}}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: {{ns}}
  labels:
    role: client
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: client
      image: docker.io/library/busybox:1.37
      command: ["sleep", "infinity"]
