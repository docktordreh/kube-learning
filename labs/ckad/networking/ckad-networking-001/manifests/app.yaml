apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: {{ns}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: httpd
          image: docker.io/library/busybox:1.37
          # Answers every known path with its own name, so routing is visible.
          command:
            - sh
            - -c
            - mkdir -p /www && for f in index.html api video; do echo "served by api-server" > /www/$f; done && exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: {{ns}}
spec:
  selector:
    app: api-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
