apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
  labels:
    app: {{app}}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{app}}
  template:
    metadata:
      labels:
        app: {{app}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          # Built on this host by the lab setup and loaded into the nodes; never pulled.
          image: cka-lab/{{app}}:1.0  # cka: unlisted-image
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  selector:
    app: {{app}}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: {{ns}}
  labels:
    role: client
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: client
      image: docker.io/library/busybox:1.37
      command: ["sleep", "infinity"]
