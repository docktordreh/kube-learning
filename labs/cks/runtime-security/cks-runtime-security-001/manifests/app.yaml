apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
  labels:
    app: {{app}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{app}}
  template:
    metadata:
      labels:
        app: {{app}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: docker.io/library/busybox:1.37
          # Writes its content to /tmp at start-up.
          command:
            - sh
            - -c
            - mkdir -p /tmp/www && echo "{{app}} ok" > /tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  selector:
    app: {{app}}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{debug}}
  namespace: {{ns}}
  labels:
    app: {{debug}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{debug}}
  template:
    metadata:
      labels:
        app: {{debug}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: toolbox
          image: docker.io/library/busybox:1.37
          command: ["sleep", "infinity"]
          securityContext:
            privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: {{ns}}
  labels:
    role: client
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: client
      image: docker.io/library/busybox:1.37
      command: ["sleep", "infinity"]
