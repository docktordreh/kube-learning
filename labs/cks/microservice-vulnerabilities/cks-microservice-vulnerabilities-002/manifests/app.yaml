apiVersion: v1
kind: Secret
metadata:
  name: {{secret}}
  namespace: {{ns}}
type: Opaque
stringData:
  password: {{value}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
  labels:
    app: {{app}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{app}}
  template:
    metadata:
      labels:
        app: {{app}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: docker.io/library/busybox:1.37
          env:
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{secret}}
                  key: password
          command: ["sh", "-c", "mkdir -p /tmp/www && echo '{{app}} ready' > /tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  selector:
    app: {{app}}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: {{ns}}
  labels:
    role: client
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: client
      image: docker.io/library/busybox:1.37
      command: ["sleep", "infinity"]
