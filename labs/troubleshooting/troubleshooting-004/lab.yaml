id: troubleshooting-004
title: Running Pods that never become Ready
domain: troubleshooting
objectives: [troubleshooting/services, workloads/self-healing]
difficulty: 2
estimated_minutes: 7
backends: [kind, kubeadm]
namespaces: ["{{ns}}"]
params:
  ns: {choices: [shipping, tracking, fleet]}
  app: {choices: [routes, geo, eta]}
  wrong_path: {choices: [/healthz, /ready, /status]}

setup:
  - apply: manifests/app.yaml
  - wait: {type: pods_ready, namespace: "{{ns}}", selector: "role=client"}
  - wait:
      type: jsonpath
      resource: "pods -l app={{app}}"
      namespace: "{{ns}}"
      jsonpath: "{.items[*].status.phase}"
      value: "Running Running"
    timeout: 90

checks:
  - id: ready
    description: "Deployment {{app}} is available (2/2 Ready)"
    type: deployment_ready
    namespace: "{{ns}}"
    name: "{{app}}"
    replicas: 2
    timeout: 60
  - id: endpoints
    description: "Service {{app}} has 2 ready endpoints"
    type: service_endpoints
    namespace: "{{ns}}"
    service: "{{app}}"
    min_ready: 2
    timeout: 30
  - id: traffic
    description: "client can reach http://{{app}}"
    type: exec
    namespace: "{{ns}}"
    pod: client
    command: [wget, -qO-, -T, "3", "http://{{app}}"]
    output_matches: "Welcome to nginx"
    timeout: 20
  - id: probe-kept
    role: guard
    description: "Readiness probe is still an HTTP probe"
    type: jsonpath
    resource: "deployment/{{app}}"
    namespace: "{{ns}}"
    jsonpath: "{.spec.template.spec.containers[0].readinessProbe.httpGet.port}"
    op: nonempty

hints:
  - "`kubectl -n {{ns}} get pods` shows `0/1` READY although the Pods are Running. What decides readiness?"
  - "`kubectl -n {{ns}} events` (or `kubectl describe pod <one-pod-name>`) shows `Readiness probe failed:` with the HTTP status code. Note: since kubectl 1.37, `describe` with `-l` hides events unless you add `--show-events`."
  - "Test what the container really serves: `kubectl -n {{ns}} exec client -- wget -S -qO- http://<pod-ip>{{wrong_path}}`. Point the probe at a path that answers 200 and keep it an HTTP probe."

competencies:
  - Readiness vs liveness semantics
  - Reading probe failure events
  - How readiness gates Service endpoints

docs:
  - https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  - https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#container-probes
