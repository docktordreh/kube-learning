id: troubleshooting-006
title: Production workload cannot reach its backend
domain: troubleshooting
objectives: [troubleshooting/services, networking/network-policies, networking/coredns]
difficulty: 4
estimated_minutes: 12
backends: [kind, kubeadm]
namespaces: ["{{ns}}", "{{ns}}-partners"]
params:
  ns: {choices: [production, prod, live]}

setup:
  - apply: manifests/app.yaml
  - wait: {type: deployment_ready, namespace: "{{ns}}", name: backend}
  - wait: {type: deployment_ready, namespace: "{{ns}}", name: frontend}
  - wait: {type: deployment_ready, namespace: "{{ns}}-partners", name: decoy}
  - capture: backend_gen
    resource: deployment/backend
    namespace: "{{ns}}"
    jsonpath: "{.metadata.generation}"

checks:
  - id: frontend-to-backend
    description: "frontend reaches http://backend by Service name"
    type: exec
    namespace: "{{ns}}"
    selector: app=frontend
    command: [wget, -qO-, -T, "3", "http://backend"]
    output_matches: "Welcome to nginx"
    timeout: 20
  - id: fqdn
    description: "frontend resolves backend.{{ns}}.svc.cluster.local"
    type: exec
    namespace: "{{ns}}"
    selector: app=frontend
    command: [nslookup, "backend.{{ns}}.svc.cluster.local"]
    timeout: 20
  - id: egress-still-restricted
    role: guard
    description: "frontend still cannot reach unrelated services (egress policy effective)"
    type: exec
    namespace: "{{ns}}"
    selector: app=frontend
    command: [wget, -qO-, -T, "3", "http://decoy.{{ns}}-partners"]
    expect: failure
  - id: policy-kept
    role: guard
    description: "NetworkPolicy frontend-egress still exists"
    type: exists
    resource: networkpolicy/frontend-egress
    namespace: "{{ns}}"
  - id: backend-untouched
    role: guard
    description: "backend Deployment not modified"
    type: jsonpath
    resource: deployment/backend
    namespace: "{{ns}}"
    jsonpath: "{.metadata.generation}"
    value: "{{captured.backend_gen}}"

hints:
  - "Reproduce from the client side: `kubectl -n {{ns}} exec deploy/frontend -- wget -qO- -T 3 http://backend`. Then try the backend's ClusterIP directly. Does the difference point at routing or at name resolution?"
  - "Name resolution needs UDP/TCP 53 to the CoreDNS Pods in kube-system. What restricts what the frontend Pods may *send*? `kubectl -n {{ns}} get networkpolicy -o yaml`."
  - "Add an egress rule that allows port 53 (UDP and TCP) to the kube-dns Pods (namespaceSelector `kubernetes.io/metadata.name: kube-system` + podSelector `k8s-app: kube-dns`), either in the existing policy or in a new one. Do not open egress to everything."

competencies:
  - Systematic client-side network troubleshooting (DNS vs IP connectivity)
  - Egress NetworkPolicies and DNS
  - Making minimal fixes without weakening security policy

docs:
  - https://kubernetes.io/docs/concepts/services-networking/network-policies/
  - https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/
  - https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
