apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ns}}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.31-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ns}}
spec:
  selector:
    app: backend
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ns}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: frontend
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - while true; do wget -qO /dev/null -T 3 http://backend && echo ok || echo "backend unreachable"; sleep 5; done
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress
  namespace: {{ns}}
  annotations:
    description: frontend may only talk to the backend tier
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decoy
  namespace: {{ns}}-partners
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decoy
  template:
    metadata:
      labels:
        app: decoy
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.31-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: decoy
  namespace: {{ns}}-partners
spec:
  selector:
    app: decoy
  ports:
    - port: 80
