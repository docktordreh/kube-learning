apiVersion: v1
kind: ConfigMap
metadata:
  name: {{app}}-config
  namespace: {{ns}}
data:
  settings.env: |
    MODE={{mode}}
    BATCH_SIZE=50
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{app}}
  template:
    metadata:
      labels:
        app: {{app}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: {{app}}
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - |
              set -e
              echo "loading /etc/{{app}}/settings.conf"
              . /etc/{{app}}/settings.conf
              echo "$MODE" > /tmp/ready
              echo "started in $MODE mode, batch size $BATCH_SIZE"
              exec sleep infinity
          readinessProbe:
            exec:
              command: [cat, /tmp/ready]
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/{{app}}
      volumes:
        - name: config
          configMap:
            name: {{app}}-config
