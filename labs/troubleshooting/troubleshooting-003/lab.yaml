id: troubleshooting-003
title: Pods Pending with no node to fit them
domain: troubleshooting
objectives: [workloads/scheduling, troubleshooting/monitoring]
difficulty: 2
estimated_minutes: 6
backends: [kind, kubeadm]
namespaces: ["{{ns}}"]
params:
  ns: {choices: [analytics, ml, batch-jobs]}
  app: {choices: [trainer, aggregator, crawler]}
  cpu: {choices: ["40", "64", "96"]}

setup:
  - apply: manifests/app.yaml
  - wait:
      type: jsonpath
      resource: "pods -l app={{app}}"
      namespace: "{{ns}}"
      jsonpath: "{.items[0].status.conditions[?(@.type=='PodScheduled')].reason}"
      value: Unschedulable
    timeout: 60

checks:
  - id: available
    description: "Deployment {{app}} runs 2/2 replicas"
    type: deployment_ready
    namespace: "{{ns}}"
    name: "{{app}}"
    replicas: 2
    timeout: 60
  - id: cpu-request
    description: "CPU request is 250m"
    type: jsonpath
    resource: "deployment/{{app}}"
    namespace: "{{ns}}"
    jsonpath: "{.spec.template.spec.containers[0].resources.requests.cpu}"
    value: 250m
  - id: memory-request-kept
    role: guard
    description: "Memory request still 128Mi"
    type: jsonpath
    resource: "deployment/{{app}}"
    namespace: "{{ns}}"
    jsonpath: "{.spec.template.spec.containers[0].resources.requests.memory}"
    value: 128Mi

hints:
  - "Describe one of the Pending Pods (`kubectl -n {{ns}} describe pod <name>`) or run `kubectl -n {{ns}} events`: the scheduler explains in a FailedScheduling event why no node fits."
  - "Compare the Pod's requests with what nodes can offer: `kubectl describe node <node>` → Allocatable and Allocated resources."
  - "The application team measured 250m CPU per replica. Change only the CPU request (`kubectl set resources ... --requests=cpu=250m`); memory stays as it is."

competencies:
  - Interpreting FailedScheduling events
  - Node allocatable vs requested resources
  - Adjusting resource requests

docs:
  - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  - https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/
  - https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/#my-pod-stays-pending
