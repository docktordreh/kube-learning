id: troubleshooting-002
title: Pods stuck in ImagePullBackOff
domain: troubleshooting
objectives: [troubleshooting/logs, workloads/deployments]
difficulty: 1
estimated_minutes: 4
backends: [kind, kubeadm]
namespaces: ["{{ns}}"]
params:
  ns: {choices: [frontend, marketing, campaigns]}
  app: {choices: [banner, promo, teaser]}

setup:
  - apply: manifests/app.yaml
  - wait:
      type: jsonpath
      resource: "pods -l app={{app}}"
      namespace: "{{ns}}"
      jsonpath: "{.items[*].status.containerStatuses[*].state.waiting.reason}"
      op: matches
      value: "ErrImagePull|ImagePullBackOff"
    timeout: 120

checks:
  - id: image
    description: "Container uses the intended image nginx:1.31-alpine"
    type: jsonpath
    resource: "deployment/{{app}}"
    namespace: "{{ns}}"
    jsonpath: "{.spec.template.spec.containers[0].image}"
    op: matches
    value: "(^|/)nginx:1\\.31-alpine$"
  - id: available
    description: "Deployment {{app}} is available (2/2)"
    type: deployment_ready
    namespace: "{{ns}}"
    name: "{{app}}"
    replicas: 2
    timeout: 60

hints:
  - "`kubectl -n {{ns}} get pods` shows the status; `kubectl -n {{ns}} describe pod <pod>` shows the Events at the bottom."
  - "The events name the exact image reference the kubelet tried to pull. Read it character by character."
  - "Fix the image in the Deployment (`kubectl set image deployment/{{app}} <container>=<image>`); the container is called `web`."

competencies:
  - Reading Pod events for image pull failures
  - Fixing a Deployment's image reference

docs:
  - https://kubernetes.io/docs/concepts/containers/images/
  - https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/
