# Pinned toolchain. Verified 2026-10-19.
# kind release notes: https://github.com/kubernetes-sigs/kind/releases/tag/v0.33.0
kind:
  version: v0.33.0
  node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
kubectl:
  # https://dl.k8s.io/release/stable.txt
  version: v1.37.1
helm:
  # https://github.com/helm/helm/releases (verified 2026-10-23); checksum from get.helm.sh.
  version: v4.3.1
kubeadm:
  # Ubuntu box for the Vagrant/libvirt backend (publishes amd64 and arm64 libvirt builds).
  box: cloud-image/ubuntu-24.04
  box_version: "20260926.0.0"
  kubernetes_minor: "1.37"
  # Baseline cluster version and the target used by the upgrade lab.
  kubernetes_version: "1.37.0"
  upgrade_version: "1.37.1"
  crictl_version: v1.37.0
  calico_version: v3.33.0
  pod_subnet: 10.244.0.0/16
  # Kept distinct from the hand-managed lab in cka/ (192.168.250.0/24).
  network_prefix: 192.168.251
# Shared cluster add-ons, installed with Helm when a lab lists them in `requires`.
components:
  gateway-api:
    # Gateway API CRDs, standard channel. v1.6.3 is the version Traefik v3.7.16 is built
    # against (its go.mod). The release publishes no checksum; digest recorded 2026-10-23.
    manifest: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml
    sha256: 356c2b8e286a964dc20995435659ad1095386329974793af10bbfe3eff977fe5
  traefik:
    # Ingress and Gateway API controller: IngressClass and GatewayClass "traefik", reachable
    # in-cluster at http://traefik.traefik.svc.cluster.local (port 80 -> entrypoint "web",
    # container port 8000, which Gateway listeners must use). Chart 42.1.3 = Traefik v3.7.16,
    # digest from https://traefik.github.io/charts/index.yaml (verified 2026-10-23).
    chart: https://traefik.github.io/charts/traefik/traefik-42.1.3.tgz
    sha256: 10ec2b032fd7ec9fa04a8816872e20ba0fafc47231f6394b5cb5d522f3b0ef50
    release: traefik
    namespace: traefik
    requires: [gateway-api]
    images: [docker.io/library/traefik:v3.7.16]
    values:
      image: {registry: docker.io, repository: library/traefik, tag: v3.7.16}
      service: {spec: {type: ClusterIP}}
      ingressClass: {enabled: true, isDefaultClass: true, name: traefik}
      providers: {kubernetesGateway: {enabled: true}}
      gatewayClass: {enabled: true, name: traefik}
      # Labs create their own Gateways.
      gateway: {enabled: false}
# Images used by lab manifests. `cka setup` pulls them once and loads them into the cluster,
# so labs work offline. Labs may only reference images listed here (a test enforces it).
images:
  - docker.io/library/busybox:1.37
  - docker.io/library/nginx:1.30-alpine
  - docker.io/library/nginx:1.31-alpine
  - docker.io/library/nginx:1.31-alpine@sha256:060849a174666c53439dc7cecbf8f67e225c7cbfb1a44ca97915d9a172a81e6d
  - docker.io/library/traefik:v3.7.16
