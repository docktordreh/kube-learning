[project]
name = "cka-labs"
version = "0.1.0"
description = "Self-hosted CKA practice lab generator and exam simulator"
readme = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "typer>=0.27",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "rich>=13",
]

[project.scripts]
cka = "cka_labs.cli:main"

[dependency-groups]
dev = ["pytest>=9.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cka_labs"]

[tool.hatch.build.targets.wheel.force-include]
"labs" = "cka_labs/_labs"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real disposable cluster (run with: pytest -m integration)",
    "kubeadm: needs the Vagrant/libvirt kubeadm backend",
]
addopts = "-m 'not integration and not kubeadm'"
